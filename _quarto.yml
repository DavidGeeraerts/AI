project:
  type: book
  output-dir: _book

book:
  title: "The Book of AI -- A practical guide to understanding agents and building a practical toolkit you control."
  subtitle: "Mapping the Artificial Intelligence Landscape"
  author: "David Geeraerts"
  date: today
  date-format: long
  page-navigation: true
  page-footer:
    right: 
      - icon: github
        href: https://github.com/davidgeeraerts/AI
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-models.qmd
    - chapters/03-running-a-model.qmd
    - chapters/04-agents-and-harnesses.qmd
    - chapters/05-building-a-working-stack.qmd
    - chapters/06-miscellaneous-tools.qmd
    - chapters/07-resources.qmd
    - chapters/08-keeping-the-map-alive.qmd
  appendices:
    - appendices/Glossary.qmd
    - appendices/Notes.qmd


format:
  html:
    from: markdown+emoji
    theme: cosmo
    toc: true
    smooth-scroll: true
