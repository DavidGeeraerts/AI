project:
  type: book
  output-dir: docs
  pre-render: quarto run scripts/generate-glossary.ts
  render:
    - "*.qmd"
  preview:
    browser: false
    watch-inputs: true
    navigate: true
glossary:
  path: appendices/glossary.yml
  popup: click
  show: true



format:
  html:
    page-layout: full
#    respect-user-color-scheme: true
    theme: 
      light: flatly
      dark: darkly
    font-size: medium
    smooth-scroll: true
    from: markdown+emoji
    toc: true
    code-copy: true
    code-link: true
  epub:
    title-page: true
    toc: true
    toc-depth: 2
    font-size: medium
    from: markdown+emoji
  pdf: default

book:
  title: "The Book of AI"
  subtitle: "Mapping the practical Artificial Intelligence landscape"
  description: "A practical guide to understanding agentic engineering and building a practical toolkit."
  author: "David Geeraerts"
  abstract: "This book is a practical guide to understanding agentic engineering and building a practical toolkit."
  date: last-modified
  date-format: iso
  cover-image: assets/images/Book-Cover.jpg
  favicon: assets/images/Book-Cover-Banner.jpg
  site-url: https://davidgeeraerts.github.io/AI
  repo-url: https://github.com/davidgeeraerts/AI
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  language: en
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-models.qmd
    - chapters/03-running-a-model.qmd
    - chapters/04-agents-and-harnesses.qmd
    - chapters/05-building-a-working-stack.qmd
    - chapters/06-miscellaneous-tools.qmd
    - chapters/07-resources.qmd
    - chapters/08-keeping-the-map-alive.qmd
  appendices:
    - hotplate/hotplate_index.qmd
    - appendices/glossary.qmd
    - appendices/notes.qmd
    - appendices/prompt-engineering-notes.qmd
  downloads: [pdf, epub]
  sharing: [twitter]

execute:
  freeze: auto
  cache: false
