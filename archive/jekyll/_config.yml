title: The Book of AI
description: AI landscape overview and practical toolkit for AI practitioners and enthusiasts.
author: David Geeraerts
remote_theme: just-the-docs/just-the-docs

search_enabled: true

plugins:
  - jekyll-remote-theme
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jemoji

readme_index:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

exclude:
  - AGENTS.md
  - LICENSE
  - .github
  - .quarto
  - _quarto.yml
  - index.qmd
  - chapters
  - chatper-structure.md
  - Gemfile
  - vendor
